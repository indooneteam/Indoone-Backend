name: Indoone Knowledge Auto Update

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "app/ai/self_update.py"
      - "scripts/self_update_knowledge.py"
      - "config/self_update_sources.json"
      - ".github/workflows/auto-self-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indoone-knowledge-auto-update
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect trusted web updates
        run: python scripts/self_update_knowledge.py

      - name: Commit knowledge updates
        run: |
          if git diff --quiet -- data/knowledge/auto_web.txt data/self_update/state.json; then
            echo "No new knowledge updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge/auto_web.txt data/self_update/state.json
          git commit -m "chore(ai): refresh trusted web knowledge"
          git push origin main
