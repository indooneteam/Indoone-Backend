name: Indoone AI Training Readiness

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "app/ai/**"
      - "app/api/**"
      - "data/raw/**"
      - "data/eval/**"
      - "data/evaluation/**"
      - "scripts/**"
      - "training_manifest.json"
      - ".github/workflows/auto-ai-training.yml"
  workflow_dispatch:
    inputs:
      run_hosted_training:
        description: "Run the slow GitHub-hosted CPU training path (Colab GPU is the normal training path)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: indoone-ai-training
  cancel-in-progress: true

jobs:
  prepare:
    name: Audit training readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build balanced Indian-language training pack
        run: python scripts/build_multilingual_training_pack.py

      - name: Audit final training data sources
        run: |
          python scripts/audit_dataset.py --json             --corpus data/processed/generated_multilingual_corpus.txt             --instructions data/raw/indoone_instructions.jsonl             --instructions data/raw/core_instruction_seed.jsonl             --instructions data/raw/indoone_multilingual_examples.jsonl             --instructions data/raw/indoone_phone_contacts_examples.jsonl             --instructions data/processed/generated_multilingual_examples.jsonl             --multilingual data/processed/generated_multilingual_examples.jsonl

      - name: Assemble curated training dataset
        run: |
          python scripts/assemble_training_dataset.py             --source data/raw/indoone_instructions.jsonl             --source data/raw/core_instruction_seed.jsonl             --source data/raw/indoone_multilingual_examples.jsonl             --output data/processed/curated_instructions.jsonl             --validation-output data/processed/instructions_validation.jsonl

      - name: Validate final curated and generated data
        run: |
          python scripts/validate_dataset_quality.py             --source data/processed/curated_instructions.jsonl             --source data/processed/instructions_validation.jsonl             --source data/processed/generated_multilingual_examples.jsonl             --source data/raw/indoone_phone_contacts_examples.jsonl

      - name: Validate training manifest
        run: python scripts/validate_training_manifest.py

      - name: Validate final training recipe
        run: python scripts/validate_final_training_recipe.py


  train_and_promote:
    name: Train, gate, and publish model
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_training == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build balanced Indian-language training pack
        run: python scripts/build_multilingual_training_pack.py

      - name: Report training runtime and select safe runtime budget
        env:
          INDOONE_ALLOW_CPU_TRAINING: "true"
        run: |
          python - <<'PY'
          import torch
          print(f"torch={torch.__version__}")
          print(f"cuda_available={torch.cuda.is_available()}")
          if torch.cuda.is_available():
              print("Using full GPU training budget.")
          else:
              print("Using bounded CPU training budget; Colab GPU remains the preferred path.")
          PY

          if python -c 'import torch,sys; sys.exit(0 if torch.cuda.is_available() else 1)'; then
            {
              echo 'INDOONE_TRAIN_STEPS=2000'
              echo 'INDOONE_TRAIN_BATCH_SIZE=16'
              echo 'INDOONE_TRAIN_CHECKPOINT_INTERVAL=500'
            } >> "$GITHUB_ENV"
          else
            {
              echo 'INDOONE_TRAIN_STEPS=300'
              echo 'INDOONE_TRAIN_BATCH_SIZE=2'
              echo 'INDOONE_TRAIN_CHECKPOINT_INTERVAL=100'
            } >> "$GITHUB_ENV"
          fi

      - name: Train candidate and run base evaluation
        env:
          INDOONE_TRAINING_TRIGGER: "manual-hosted"
          INDOONE_GIT_SHA: ${{ github.sha }}
          INDOONE_ALLOW_CPU_TRAINING: "true"
        run: |
          python scripts/run_training_pipeline.py \
            --steps "$INDOONE_TRAIN_STEPS" \
            --batch-size "$INDOONE_TRAIN_BATCH_SIZE" \
            --checkpoint-interval "$INDOONE_TRAIN_CHECKPOINT_INTERVAL" \
            --learning-rate 1e-4 \
            --instruction-mix-ratio 0.8 \
            --seed 42 \
            --skip-upload

      - name: Run behavioral promotion gate
        run: |
          python -m app.ai.behavior_eval \
            --cases data/eval/behavior.jsonl \
            --checkpoint models/indoone-small/indoone-small.pt \
            --tokenizer models/indoone-small/tokenizer.json \
            --output models/indoone-small/behavior_eval.json

      - name: Promote only when all gates pass
        env:
          MODEL_VERSION: "auto-${{ github.sha }}"
        run: |
          python scripts/promote_model.py \
            --version "$MODEL_VERSION" \
            --model-dir models/indoone-small \
            --behavior-cases data/eval/behavior.jsonl \
            --registry models/registry.json

      - name: Publish promoted model to B2
        run: python scripts/upload_model_to_b2.py --model-dir models/indoone-small --prefix models/indoone-small

      - name: Persist active model registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/registry.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ai): promote auto-trained model [skip ci]"
          git push origin main

      - name: Upload promoted training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indoone-training-${{ github.sha }}
          path: |
            models/indoone-small/
            data/processed/
            models/registry.json
          if-no-files-found: error

  colab_note:
    name: Colab GPU training path
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Explain training path
        run: |
          echo "Hosted GitHub CPU training is disabled for automatic pushes."
          echo "Run colab/Indoone_AI_Training_GPU.ipynb on a Colab GPU for the actual training."
          echo "The notebook runs training, behavioral gating, response-diversity testing, promotion, and optional B2 upload."

  note:
    name: Explain blocked automatic training
    needs: prepare
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report blocked automatic training
        run: |
          echo "Automatic model training was blocked by a dataset readiness or quality gate."
          echo "Expand or repair the curated training data, then rerun the workflow."
