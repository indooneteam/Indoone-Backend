name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Run production security smoke test
        run: python scripts/security_smoke.py
      - name: Prepare and validate final training recipe
        run: |
          python scripts/build_multilingual_training_pack.py
          python scripts/prepare_dataset.py             --source data/raw/indoone_corpus.txt             --output-dir data/processed
          python scripts/assemble_training_dataset.py             --source data/raw/indoone_instructions.jsonl             --source data/raw/core_instruction_seed.jsonl             --source data/raw/indoone_multilingual_examples.jsonl             --output data/processed/curated_instructions.jsonl             --validation-output data/processed/instructions_validation.jsonl
          python scripts/validate_dataset_quality.py             --source data/processed/curated_instructions.jsonl             --source data/processed/instructions_validation.jsonl             --source data/processed/generated_multilingual_examples.jsonl             --source data/raw/indoone_phone_contacts_examples.jsonl
          python scripts/validate_training_manifest.py
          python scripts/validate_final_training_recipe.py
