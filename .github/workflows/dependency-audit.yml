name: Dependency audit

# A published vulnerability in a pinned package is not something a test suite notices.
# This job reads requirements.txt against the advisory database, so a bad pin shows up
# without anyone remembering to look.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --quiet --upgrade pip-audit

      - name: Audit requirements
        # The report is the point; a failure here means a package in use has a known
        # vulnerability and someone should decide, not that the build is broken by a
        # transitive pin nobody can move.
        run: python -m pip_audit -r requirements.txt --no-deps --progress-spinner off
        continue-on-error: true

      - name: Audit the installed environment
        run: python -m pip_audit --progress-spinner off
        continue-on-error: true
