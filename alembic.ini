# Alembic configuration for Indoone-Backend.
#
# The database URL is deliberately NOT set here. It is read from the application's
# own configuration (INDOONE_DATABASE_URL, falling back to the SQLite file named by
# INDOONE_CAPABILITY_DB) by migrations/env.py, so there is one place that decides
# which database the app talks to and the migration always talks to the same one.
# A URL written here would be a second source of truth, and the first thing to drift.

[alembic]
script_location = migrations
prepend_sys_path = .
# Both separators are named because Alembic warns on either one missing, and the
# CI test run turns warnings into errors.
path_separator = os
version_path_separator = os
# Revisions are named by hand, in order: 0001_baseline, 0002_..., so the history reads
# as a list rather than as twelve random hex strings.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
