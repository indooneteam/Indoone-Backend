# Dependencies are watched rather than remembered.
#
# Nothing in this repository told anyone that a package had a published vulnerability, so
# the only way to find out was to look. Dependabot opens a PR when one appears, and the
# normal CI gate decides whether it merges.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
