name: Indoone Dataset Quality

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "data/raw/**"
      - "scripts/validate_dataset_quality.py"
      - "tests/test_validate_dataset_quality.py"
  pull_request:
    branches:
      - main
    paths:
      - "data/raw/**"
      - "scripts/validate_dataset_quality.py"
      - "tests/test_validate_dataset_quality.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run dataset quality checks
        run: python scripts/validate_dataset_quality.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_validate_dataset_quality.py
